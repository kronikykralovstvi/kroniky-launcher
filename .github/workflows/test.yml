name: Test launcher
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Mods.Tests.csproj
      - run: dotnet build src/Launcher/Launcher.csproj --no-self-contained -p:PublishSingleFile=false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_*.py"
